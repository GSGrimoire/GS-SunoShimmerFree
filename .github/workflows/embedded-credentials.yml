name: Embedded credential regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'edit.js'
      - 'tests/security/no-embedded-credentials.test.cjs'
      - '.github/workflows/embedded-credentials.yml'
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'edit.js'
      - 'tests/security/no-embedded-credentials.test.cjs'
      - '.github/workflows/embedded-credentials.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security/no-embedded-credentials.test.cjs
