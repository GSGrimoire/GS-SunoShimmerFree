name: Transactional export checks
on:
  push:
    paths:
      - 'studio-transactional-sink.js'
      - 'tests/studio_transactional_sink_test.js'
      - '.github/workflows/transactional-export.yml'
  pull_request:
    paths:
      - 'studio-transactional-sink.js'
      - 'tests/studio_transactional_sink_test.js'
      - '.github/workflows/transactional-export.yml'
jobs:
  transaction:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/studio_transactional_sink_test.js
