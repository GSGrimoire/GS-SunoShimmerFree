name: Full repository secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Tracked files and complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install pinned Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.24.3
      - name: Verify complete history is present
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan all reachable branch history (redacted)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --redact --exit-code 1 --no-banner .
      - name: Scan current tracked working tree (redacted)
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir --redact --exit-code 1 --no-banner .
