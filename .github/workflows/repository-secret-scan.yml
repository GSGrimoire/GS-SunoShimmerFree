name: Full repository secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Tracked snapshot and fetched Git refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install pinned Gitleaks and verify version
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" version
      - name: Fetch accessible branches, tags and pull-request refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin '+refs/tags/*:refs/tags/*'
          # GitHub exposes open and some closed PR refs; unavailable refs cannot be scanned.
          git fetch origin '+refs/pull/*/head:refs/remotes/pull/*/head' '+refs/pull/*/merge:refs/remotes/pull/*/merge'
          echo "Revision: $(git rev-parse HEAD)"
          echo "Fetched branch refs: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          echo "Fetched pull-request refs: $(git for-each-ref --format='%(refname)' refs/remotes/pull | wc -l)"
          echo "Fetched tag refs: $(git for-each-ref --format='%(refname)' refs/tags | wc -l)"
          echo "Reachable commits: $(git rev-list --all --count)"
      - name: Scan fetched reachable Git history (redacted)
        id: history
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --redact --exit-code 1 --no-banner .
      - name: Scan tracked HEAD snapshot (redacted)
        id: snapshot
        if: always() && steps.history.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$snapshot"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --exit-code 1 --no-banner "$snapshot"
      - name: Enforce both scan results
        if: always()
        shell: bash
        env:
          HISTORY: ${{ steps.history.outcome }}
          SNAPSHOT: ${{ steps.snapshot.outcome }}
        run: |
          echo "History scan outcome: $HISTORY"
          echo "Tracked HEAD snapshot outcome: $SNAPSHOT"
          test "$HISTORY" = success
          test "$SNAPSHOT" = success
