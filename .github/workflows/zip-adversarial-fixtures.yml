name: Synthetic ZIP security fixture checks
on:
  pull_request:
    paths:
      - 'tests/security/zip-adversarial-fixtures.cjs'
      - 'tests/security/zip-adversarial-fixtures.test.cjs'
      - '.github/workflows/zip-adversarial-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security/zip-adversarial-fixtures.test.cjs
