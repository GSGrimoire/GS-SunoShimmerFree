name: Active HTML embed boundary
on:
  pull_request:
    paths:
      - index.html
      - tests/security/no-active-remote-embeds.test.cjs
      - .github/workflows/active-html-embed-boundary.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/security/no-active-remote-embeds.test.cjs
      - .github/workflows/active-html-embed-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-embed-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/security/no-active-remote-embeds.test.cjs
