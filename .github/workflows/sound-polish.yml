name: Sound Polish checks

on:
  push:
    paths:
      - 'polish.js'
      - 'stem-zip.js'
      - 'stem-ui.js'
      - 'stem-mp3.js'
      - 'stem-resample.js'
      - 'stem-audio-worker.js'
      - 'stem.css'
      - 'loudness.js'
      - 'polish-worker.js'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'edit.js'
      - 'wav.js'
      - 'export-worker.js'
      - 'mp3.js'
      - 'cli.js'
      - 'engine.js'
      - 'worker.js'
      - 'vendor/**'
      - '.nojekyll'
      - 'studio-transactional-sink.js'
      - 'studio-source-bytes.js'
      - 'tests/**'
      - '.github/workflows/sound-polish.yml'
  pull_request:
    paths:
      - 'polish.js'
      - 'stem-zip.js'
      - 'stem-ui.js'
      - 'stem-mp3.js'
      - 'stem-resample.js'
      - 'stem-audio-worker.js'
      - 'stem.css'
      - 'loudness.js'
      - 'polish-worker.js'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'edit.js'
      - 'wav.js'
      - 'export-worker.js'
      - 'mp3.js'
      - 'cli.js'
      - 'engine.js'
      - 'worker.js'
      - 'vendor/**'
      - '.nojekyll'
      - 'studio-transactional-sink.js'
      - 'studio-source-bytes.js'
      - 'tests/**'
      - '.github/workflows/sound-polish.yml'

jobs:
  sound-polish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fixture suites fail instead of skipping, and read the pinned Viking stems.
      SSF_REQUIRE_FIXTURES: '1'
      SSF_VIKING_DIR: /tmp/viking-shimmer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg (needed by the parity, acceptance, loudness and MP3 suites)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Provision the ten public Viking stems, pinned to main commit c6b882c
        # Fetched by commit SHA, so git verifies every byte. Extracted outside the
        # checkout, so the gate still sees a clean working tree.
        run: |
          git fetch --no-tags --depth=1 origin c6b882c2364a973a134466aafadc2ea2a216700c
          git archive FETCH_HEAD example-files/viking-shimmer | tar -x -C /tmp --strip-components=1
          test "$(ls "$SSF_VIKING_DIR"/*.mp3 | wc -l)" -eq 10
      - name: Milestone A acceptance gate (every suite, strict fixtures, clean checkout, no SKIP)
        run: node tests/run_acceptance_gate.js
      - name: Test editor regression against synthetic WAV
        run: |
          node -e 'const fs=require("fs"),w=require("./wav.js"),s=48000,n=s*5,a=Array.from({length:2},(_,c)=>Float32Array.from({length:n},(_,i)=>.2*Math.sin(2*Math.PI*(240+c*190)*i/s)));fs.writeFileSync("/tmp/ssf-edit-fixture.wav",Buffer.from(w.encodeWav(a,s,24)))'
          node tests/edit_test.js /tmp/ssf-edit-fixture.wav /tmp/ssf-edit-test-outputs
